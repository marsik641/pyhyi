[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyhyi"
dynamic = ["version"]
description = "Repository hygiene checker: catches the mess autonomous coding agents leave behind."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/marsik641/pyhyi"

[project.scripts]
pyhyi = "pyhyi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/pyhyi/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyhyi.per-path-ignores]
# Test fixtures and docs quote suppression markers on purpose.
"tests/**" = ["bad-suppression"]
"README.md" = ["bad-suppression"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
