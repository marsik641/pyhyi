name: Release

# Pushing a tag vX.Y.Z publishes pyhyi and its alias packages to PyPI via
# trusted publishing (no API tokens). Every package is published by its own
# job in its own environment `pypi-<package>`, matching the trusted publisher
# configured for that project on PyPI. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pyhyi/__init__.py)
          echo "tag: ${GITHUB_REF_NAME}, package: ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: uv build --out-dir dist/pyhyi
      - run: python3 scripts/build_aliases.py --out-dir dist
      - id: list
        run: echo "packages=$(ls dist | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.packages) }}
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/${{ matrix.package }}/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            echo "GitHub release already published for ${GITHUB_REF_NAME}."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
