name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyhyi check

  build:
    # Same build as the release workflow, so packaging breaks before a tag does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --out-dir dist/pyhyi
      - run: python3 scripts/build_aliases.py --out-dir dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: dist/
          retention-days: 1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
          path: restored/
      - run: diff -qr dist restored

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
      - name: Exercise both hooks in a consumer repository
        shell: bash
        run: |
          cd "$(mktemp -d)"
          git init -q
          git -c user.name=Tester -c user.email=test@example.invalid commit --allow-empty -qm 'test: consumer'
          uvx pre-commit try-repo "$GITHUB_WORKSPACE" pyhyi --all-files
          printf 'feat: sample\n' > .git/COMMIT_EDITMSG
          uvx pre-commit try-repo "$GITHUB_WORKSPACE" pyhyi-commit-msg --hook-stage commit-msg --commit-msg-filename .git/COMMIT_EDITMSG
          printf 'invalid\n' > .git/COMMIT_EDITMSG
          if uvx pre-commit try-repo "$GITHUB_WORKSPACE" pyhyi-commit-msg --hook-stage commit-msg --commit-msg-filename .git/COMMIT_EDITMSG; then
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --pyhyi
